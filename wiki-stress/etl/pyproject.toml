[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ukstress-etl"
version = "0.1.0"
description = "Reproducible Ukrainian Wiktionary stress lexicon ETL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "lxml>=5.3,<7",
  "mwparserfromhell>=0.6.6,<1",
  "psycopg[binary]>=3.2,<4",
  "zstandard>=0.23,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.122,<7",
  "lxml-stubs>=0.5,<1",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
ukstress = "ukstress.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ukstress"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
