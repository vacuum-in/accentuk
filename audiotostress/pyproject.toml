[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ukstress"
version = "0.1.0"
description = "Audio-derived Ukrainian lexical-stress mining pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ukstress contributors" }]
dependencies = [
  "numpy>=1.26",
  "pyarrow>=16",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "soundfile>=0.12",
]

[project.optional-dependencies]
alignment = ["whisperx==3.8.6"]
# The lexicon trie the miners label against. It was never declared: the
# scripts reached into one machine's uv archive by hash, which broke on the
# next machine.
lexicon = ["ukrainian-word-stress>=2.1,<3"]
youtube = ["yt-dlp>=2025.1"]
# Apple Silicon: mlx-whisper for ASR; alignment still comes from whisperx, which
# installs on macOS without CUDA and runs its wav2vec2 aligner on mps.
mac = ["mlx-whisper>=0.4", "whisperx==3.8.6", "torch>=2.8", "transformers>=4.57", "yt-dlp>=2025.1"]
canary-alignment = ["crispasr==0.8.30", "huggingface-hub>=0.34"]
features = ["torch>=2.8", "transformers>=4.57"]
training = ["torch>=2.8"]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ukstress"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = [
  "gpu: optional GPU/model integration tests, excluded from the default suite",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"] # Ukrainian text is intentional.

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ukstress"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "soundfile.*", "yaml.*"]
ignore_missing_imports = true
