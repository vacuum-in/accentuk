[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "accentuk"
version = "0.3.3"
description = "Offline Ukrainian stress marking and optional TTS preparation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "src/accentuk/assets/NOTICE.md"]
dependencies = [
  "marisa-trie>=1.2,<2", "huggingface_hub>=0.25", "ctranslate2>=4.8,<5", "torch>=2.4,<3", "transformers>=4.45,<6",
  "sentencepiece>=0.2,<1", "spacy>=3.8,<3.9", "spacy-curated-transformers>=0.3,<0.4",
  "pymorphy3>=2,<3", "pymorphy3-dicts-uk>=2.4,<3",
]

[project.optional-dependencies]
tts = ["sacremoses>=0.1,<1"]
build = ["ukrainian-word-stress==2.1.0"]
dev = ["pytest>=8,<10", "build>=1.2", "ruff>=0.9", "ukrainian-word-stress==2.1.0"]

[project.scripts]
accentuk = "accentuk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/accentuk"]

[tool.hatch.build.targets.sdist]
only-include = ["src/accentuk", "tests", "scripts", "pyproject.toml", "README.md", "LICENSE", "docs"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires released model assets and a service"]

[tool.ruff]
target-version = "py312"
line-length = 100
